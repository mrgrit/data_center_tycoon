<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Center Tycoon</title>
<meta name="description" content="데이터센터를 짓고 운영하는 경영 시뮬레이션. 전력·냉각·SLA가 실제 수치로 움직인다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hud">
  <div class="brand"><span class="dot"></span>DATA CENTER TYCOON</div>
  <div class="stats" id="stats"></div>
  <div class="speed">
    <button data-speed="0" id="btnPause" title="일시정지">❚❚</button>
    <button data-speed="1" class="on">1×</button>
    <button data-speed="4">4×</button>
    <button data-speed="16">16×</button>
    <button id="btnSave" class="ghost" title="저장">저장</button>
    <button id="btnReset" class="ghost" title="새 게임">새로</button>
  </div>
</header>

<main>
  <aside class="panel left">
    <div class="tabs" id="leftTabs">
      <button class="on" data-tab="build">건설</button>
      <button data-tab="plant">설비</button>
      <button data-tab="staff">인력</button>
    </div>
    <div class="tabbody" id="tabBuild"></div>
    <div class="tabbody hide" id="tabPlant"></div>
    <div class="tabbody hide" id="tabStaff"></div>
  </aside>

  <section class="stage">
    <canvas id="cv"></canvas>
    <div class="floorbar" id="floorbar"></div>
    <div class="hint" id="hint"></div>
  </section>

  <aside class="panel right">
    <div class="tabs" id="rightTabs">
      <button class="on" data-tab="offers">제안</button>
      <button data-tab="active">계약</button>
      <button data-tab="log">기록</button>
    </div>
    <div class="tabbody" id="tabOffers"></div>
    <div class="tabbody hide" id="tabActive"></div>
    <div class="tabbody hide" id="tabLog"></div>
  </aside>
</main>

<div class="modal hide" id="modal">
  <div class="card">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mOpts"></div>
  </div>
</div>

<div class="modal hide" id="over">
  <div class="card">
    <h2 id="oTitle"></h2>
    <p id="oText"></p>
    <div><button id="oBtn" class="primary">다시 시작</button></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
